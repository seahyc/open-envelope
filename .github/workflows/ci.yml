name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install backup tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3 age zstd poppler-utils

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:ci

      - name: Build Docker image
        run: docker build -t openenvelope:local .

      - name: Hardened compose smoke (health + synthetic import)
        run: bash scripts/docker-compose-smoke.sh
