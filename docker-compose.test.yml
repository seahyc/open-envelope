version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  openenvelope:
    build: .
    ports:
      - "3100:3100"
    environment:
      PORT: 3100
      DATABASE_PATH: /data/openenvelope.db
      AUTH_MODE: none
      LOG_LEVEL: info
      OBJECT_STORAGE_TYPE: s3
      OBJECT_STORAGE_S3_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_S3_BUCKET: openenvelope-backups
      OBJECT_STORAGE_S3_REGION: us-east-1
      OBJECT_STORAGE_S3_ACCESS_KEY_ID: minioadmin
      OBJECT_STORAGE_S3_SECRET_ACCESS_KEY: minioadmin
      BACKUP_S3_ENDPOINT: http://minio:9000
      BACKUP_S3_BUCKET: openenvelope-backups
      BACKUP_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
    volumes:
      - app-data:/data
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  minio-data:
  app-data:
