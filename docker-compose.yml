services:
  openenvelope:
    image: open-envelope:local
    build: .
    ports:
      - "${OE_BIND:-127.0.0.1}:${OE_PORT:-3100}:3100"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    tmpfs:
      - /tmp:mode=1777,size=128m
      - /home/node:uid=1000,gid=1000,mode=0755,size=64m
    volumes:
      - data:/data
      # Bind-mount ./backups must be owned by uid 1000 (container user `node`),
      # or replace this with a named volume: backups:/backups
      - ./backups:/backups
      # Optional Codex auth (uncomment to use CATEGORISER_PROVIDER=codex):
      # - ${HOME}/.codex/auth.json:/codex-auth/auth.json:ro
    environment:
      - PORT=3100
      - DATABASE_PATH=/data/openenvelope.db
      - OBJECT_STORAGE_LOCAL_PATH=/data/documents
      - AUTH_MODE=${AUTH_MODE:-none}
      - AUTH_HEADER_NAME=X-Auth-User
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - LOG_LEVEL=info
      - INGEST_API_KEY=${INGEST_API_KEY:-}
      - EMAIL_INGEST_HMAC_SECRET=${EMAIL_INGEST_HMAC_SECRET:-}
      - EMAIL_INGEST_DOMAIN=${EMAIL_INGEST_DOMAIN:-}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - LLM_PROVIDER=none
      - CATEGORISER_PROVIDER=${CATEGORISER_PROVIDER:-none}
      - CATEGORISER_AUTO_THRESHOLD=${CATEGORISER_AUTO_THRESHOLD:-0.9}
      - CODEX_BIN=/usr/local/bin/codex
      - CODEX_HOME=/tmp/codex-home
      - CODEX_MODEL=${CODEX_MODEL:-gpt-6-luna}
      - CODEX_REASONING_EFFORT=${CODEX_REASONING_EFFORT:-low}
      # Optional: disable MCP servers from a copied host config.toml
      # - CODEX_EXTRA_CONFIG=mcp_servers={}
      # Optional always-review regexes (comma or newline separated). Empty by default.
      # - CATEGORISER_ALWAYS_REVIEW=
    restart: unless-stopped

volumes:
  data:
